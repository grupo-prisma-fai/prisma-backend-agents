services:
  api:
    build: .
    container_name: westfield_agent_back_python_api
    env_file: [.env]
    # Vuelve solo tras un reboot del host; si el secreto falla, docker reintenta con backoff.
    restart: unless-stopped
    ports: ["8000:8000"]
    command: ["python", "-m", "westfield_agent_back_python.main_api"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build: .
    container_name: westfield_agent_back_python_worker
    env_file: [.env]
    restart: unless-stopped
    command: ["python", "-m", "westfield_agent_back_python.main_worker"]
    # El HEALTHCHECK del Dockerfile pega al :8000 del API; el worker no sirve HTTP.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
